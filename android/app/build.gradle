plugins {
    id 'com.android.application'
}

android {
    namespace 'com.barrarun.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.barrarun.game"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "1.0.8"
    }

    signingConfigs {
        debug {
            storeFile file("/home/box/.local/share/godot/keystores/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Large asset pack (models/wavs/vendor); keep compression sensible
    androidResources {
        noCompress 'wav', 'json', 'png', 'jpg', 'jpeg'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
